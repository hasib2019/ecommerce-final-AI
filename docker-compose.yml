# ShopBD – app (PHP 8.4 + Apache) and MySQL 8.4.   Usage: docker compose up -d --build
# First start imports database/schema.sql + database/seed.sql (demo store).
# Remove the 02-seed.sql line for an empty store. Change the passwords for production.

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:80"
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: shopbd
      DB_USERNAME: shopbd
      DB_PASSWORD: shopbd-secret
      APP_URL: ${APP_URL:-http://localhost:8080}
    volumes:
      - uploads:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: shopbd
      MYSQL_USER: shopbd
      MYSQL_PASSWORD: shopbd-secret
      MYSQL_ROOT_PASSWORD: root-secret
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - dbdata:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ushopbd", "-pshopbd-secret"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  dbdata:
  uploads:
